name: Build APK & Release

# Push ke main -> semantic-release membaca Conventional Commits sejak tag vX.Y.Z terakhir,
# menentukan versi berikutnya, membuild APK (lewat tool/ci_build_apk.sh), membuat tag + GitHub Release.
# Jika tidak ada commit yang layak rilis (docs/chore/dll), tidak ada tag dan APK tidak dibuild.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push tag + buat Release
  issues: write # semantic-release mengomentari issue/PR yang masuk rilis
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # jangan batalkan rilis yang sedang berjalan

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # wajib: butuh seluruh history & tag, juga untuk git rev-list --count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependensi & test
        run: |
          flutter pub get
          flutter gen-l10n
          flutter test

      # Tanpa secret ini APK ditandatangani debug key (lihat android/app/build.gradle.kts):
      # bisa di-install, tapi tidak bisa meng-update APK yang ditandatangani kunci rilis.
      - name: Siapkan keystore rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 kosong - APK ditandatangani debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/claymo-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=claymo-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Semantic release (versi, build APK, tag, GitHub Release)
        id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/exec@6
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK sebagai artifact
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Claymo-v${{ steps.release.outputs.new_release_version }}-release
          path: dist/Claymo-v${{ steps.release.outputs.new_release_version }}-release.apk
          if-no-files-found: error
